<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>My Todo List</h1>
    <form action="/add" method="post">
        <input type="text" name="content" placeholder="Add a new task" required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li class="{{ 'done' if task[2] else '' }}">
                {{ task[1] }}
                {% if not task[2] %}
                    <a href="/complete/{{ task[0] }}">✔</a>
                {% endif %}
                <a href="/delete/{{ task[0] }}">🗑</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
